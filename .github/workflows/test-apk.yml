name: VEN - APK de teste (sem publicar release)

on:
  workflow_dispatch:
  push:
    branches:
      - teste-playstore
      - teste-playstore-v5

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK debug para testes
        run: gradle --no-daemon assembleDebug
      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: VEN-APK-Teste-v5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
