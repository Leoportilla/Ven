name: VEN - Compilar APK automaticamente

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar e publicar APK VEN
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ler versão do app
        id: appver
        shell: bash
        run: |
          python3 - <<'PYVER' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("app/build.gradle").read_text()
          print("version_name=" + re.search(r"versionName ['\"]([^'\"]+)", text).group(1))
          print("version_code=" + re.search(r"versionCode (\d+)", text).group(1))
          PYVER
      - name: Preparar chave de assinatura fixa
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não cadastrado. Veja ASSINATURA_FIXA_PASSO_A_PASSO.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
      - name: Compilar APK assinado (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PgithubUpdater=true
      - name: Renomear APK para VEN.apk
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/VEN.apk
      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: VEN-${{ steps.appver.outputs.version_name }}-APK
          path: app/build/outputs/apk/release/VEN.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release alfa da versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: VEN ${{ steps.appver.outputs.version_name }} (ALFA)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            **VERSÃO ALFA — somente para testes.**
            versionName: ${{ steps.appver.outputs.version_name }}
            versionCode: ${{ steps.appver.outputs.version_code }}

            APK assinado com chave fixa: pode ser instalado por cima da versão anterior, mantendo os dados.
          files: app/build/outputs/apk/release/VEN.apk
      - name: Atualizar canal latest-alpha usado pelo app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-alpha
          name: VEN ${{ steps.appver.outputs.version_name }} (alfa mais recente)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            VERSÃO ALFA PARA TESTES — não é uma versão estável.
            versionName: ${{ steps.appver.outputs.version_name }}
            versionCode: ${{ steps.appver.outputs.version_code }}
          files: app/build/outputs/apk/release/VEN.apk
