name: VEN - Compilar APK e publicar nova Release alfa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK e publicar versão numerada
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ler versão do app
        id: appver
        shell: bash
        run: |
          python3 - <<'PYVER' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("app/build.gradle").read_text()
          print("version_name=" + re.search(r"versionName '([^']+)'", text).group(1))
          print("version_code=" + re.search(r"versionCode (\d+)", text).group(1))
          PYVER
      - name: Validar Secrets de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Falta o Secret KEYSTORE_BASE64"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Falta o Secret KEYSTORE_PASSWORD"; exit 1)
          test -n "$KEY_ALIAS" || (echo "Falta o Secret KEY_ALIAS"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "Falta o Secret KEY_PASSWORD"; exit 1)
      - name: Decodificar Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > app/keystore.jks
          test -s app/keystore.jks
      - name: Compilar APK release assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: VEN-${{ steps.appver.outputs.version_name }}-APK-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Criar Release numerada da versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: VEN ${{ steps.appver.outputs.version_name }} (ALFA)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            **VERSÃO ALFA — somente para testes.**
            versionName: ${{ steps.appver.outputs.version_name }}
            versionCode: ${{ steps.appver.outputs.version_code }}

            APK release assinado com o keystore configurado nos GitHub Actions Secrets. Para atualizar por cima, a chave precisa ser a mesma da versão já instalada.
          files: app/build/outputs/apk/release/app-release.apk
      - name: Atualizar canal latest-alpha usado pelo app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-alpha
          name: VEN ${{ steps.appver.outputs.version_name }} (alfa mais recente)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            VERSÃO ALFA PARA TESTES — não é uma versão estável.
            versionName: ${{ steps.appver.outputs.version_name }}
            versionCode: ${{ steps.appver.outputs.version_code }}

            APK release assinado. Instalação sobre versão anterior requer a mesma chave de assinatura da versão instalada.
          files: app/build/outputs/apk/release/app-release.apk
