name: VEN - Compilação manual do APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do VEN
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Renomear APK para VEN.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VEN.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VEN-alpha40-APK-manual
          path: app/build/outputs/apk/debug/VEN.apk
          if-no-files-found: error
          retention-days: 14
