name: Package VEN Alpha Pre-release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for alpha testing
        run: gradle --no-daemon assembleDebug
      - name: Renomear APK para VEN.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VEN.apk
      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: VEN ${{ github.ref_name }} (ALFA)
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            **VERSÃO ALFA — somente para testes.**

            APK debug para teste. A assinatura debug pode mudar entre execuções; atualizar por cima exige uma chave persistente igual à da instalação anterior.
          files: app/build/outputs/apk/debug/VEN.apk
